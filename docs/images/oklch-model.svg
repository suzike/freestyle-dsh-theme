<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" font-family="'Segoe UI','PingFang SC',sans-serif">
  <rect width="920" height="460" fill="#12162a"/>
  <text x="40" y="52" font-size="25" font-weight="700" fill="#f2f4fb">OKLCH 色彩模型 —— 三通道独立可控</text>
  <text x="40" y="82" font-size="14.5" fill="#8b96bd">每个主题由 色相(Hue) · 彩度(Chroma) · 明度(Lightness) 三通道构成</text>

  <!-- hue wheel (8 arc segments, proper circular rainbow) -->
  <g transform="translate(185,300)">
    <g stroke-width="20" fill="none">
      <path d="M 128 0 A 128 128 0 0 1 90.5 90.5" stroke="#ff5d5d"/>
      <path d="M 90.5 90.5 A 128 128 0 0 1 0 128" stroke="#ffc95d"/>
      <path d="M 0 128 A 128 128 0 0 1 -90.5 90.5" stroke="#9df05d"/>
      <path d="M -90.5 90.5 A 128 128 0 0 1 -128 0" stroke="#5df0c9"/>
      <path d="M -128 0 A 128 128 0 0 1 -90.5 -90.5" stroke="#5db8ff"/>
      <path d="M -90.5 -90.5 A 128 128 0 0 1 0 -128" stroke="#8d7bff"/>
      <path d="M 0 -128 A 128 128 0 0 1 90.5 -90.5" stroke="#ff7bd0"/>
      <path d="M 90.5 -90.5 A 128 128 0 0 1 128 0" stroke="#ff5d5d"/>
    </g>
    <circle r="116" fill="#12162a"/>
    <text x="0" y="8" font-size="16" fill="#f2f4fb" text-anchor="middle">色相 H</text>
  </g>

  <!-- three channels -->
  <g transform="translate(410,174)">
    <text x="0" y="0" font-size="18" fill="#cdd4ec">主色 · 副色 · 面板</text>
    <text x="0" y="26" font-size="14" fill="#8b96bd">每个通道独立调节色相 / 彩度 / 明度</text>
    <g transform="translate(0,54)">
      <rect x="0" y="0" width="470" height="8" rx="4" fill="#2a3252"/>
      <rect x="0" y="0" width="320" height="8" rx="4" fill="#4f8cff"/>
      <circle cx="320" cy="4" r="11" fill="#4f8cff" stroke="#12162a" stroke-width="3"/>
      <text x="0" y="36" font-size="14" fill="#8b96bd">色相 Hue · 0–360°</text>
    </g>
    <g transform="translate(0,126)">
      <rect x="0" y="0" width="470" height="8" rx="4" fill="#2a3252"/>
      <rect x="0" y="0" width="195" height="8" rx="4" fill="#7a5cff"/>
      <circle cx="195" cy="4" r="11" fill="#7a5cff" stroke="#12162a" stroke-width="3"/>
      <text x="0" y="36" font-size="14" fill="#8b96bd">彩度 Chroma · 0.01–0.28</text>
    </g>
    <g transform="translate(0,198)">
      <rect x="0" y="0" width="470" height="8" rx="4" fill="#2a3252"/>
      <rect x="0" y="0" width="385" height="8" rx="4" fill="#f45bd0"/>
      <circle cx="385" cy="4" r="11" fill="#f45bd0" stroke="#12162a" stroke-width="3"/>
      <text x="0" y="36" font-size="14" fill="#8b96bd">明度 Lightness · 0.05–0.97</text>
    </g>
  </g>
</svg>
