<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" font-family="'Segoe UI','PingFang SC',sans-serif">
  <rect width="920" height="460" fill="#12162a"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#f2f4fb">OKLCH 色彩模型 —— 三通道独立可控</text>
  <text x="40" y="82" font-size="15" fill="#8b96bd">每个主题由 色相(Hue) · 彩度(Chroma) · 明度(Lightness) 三通道构成，直觉且可控</text>

  <!-- hue wheel -->
  <g transform="translate(180,290)">
    <circle r="130" fill="none" stroke="#2a3252" stroke-width="24"/>
    <circle r="130" fill="none" stroke="url(#hue)" stroke-width="24"/>
    <defs>
      <linearGradient id="hue" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#ff5d5d"/>
        <stop offset="0.17" stop-color="#ffc95d"/>
        <stop offset="0.33" stop-color="#9df05d"/>
        <stop offset="0.5" stop-color="#5df0c9"/>
        <stop offset="0.67" stop-color="#5db8ff"/>
        <stop offset="0.83" stop-color="#8d7bff"/>
        <stop offset="1" stop-color="#ff7bd0"/>
      </linearGradient>
    </defs>
    <text x="0" y="8" font-size="17" fill="#f2f4fb" text-anchor="middle">色相 H</text>
  </g>

  <!-- three channels -->
  <g transform="translate(420,180)">
    <text x="0" y="0" font-size="18" fill="#cdd4ec">主色 · 副色 · 面板</text>
    <text x="0" y="26" font-size="14" fill="#8b96bd">每个通道独立色相/彩度/明度滑杆</text>
    <g transform="translate(0,50)">
      <rect x="0" y="0" width="440" height="8" rx="4" fill="#2a3252"/>
      <rect x="0" y="0" width="300" height="8" rx="4" fill="#4f8cff"/>
      <circle cx="300" cy="4" r="11" fill="#4f8cff" stroke="#12162a" stroke-width="3"/>
      <text x="0" y="36" font-size="14" fill="#8b96bd">色相 Hue · 0–360°</text>
    </g>
    <g transform="translate(0,120)">
      <rect x="0" y="0" width="440" height="8" rx="4" fill="#2a3252"/>
      <rect x="0" y="0" width="180" height="8" rx="4" fill="#7a5cff"/>
      <circle cx="180" cy="4" r="11" fill="#7a5cff" stroke="#12162a" stroke-width="3"/>
      <text x="0" y="36" font-size="14" fill="#8b96bd">彩度 Chroma · 0.01–0.28</text>
    </g>
    <g transform="translate(0,190)">
      <rect x="0" y="0" width="440" height="8" rx="4" fill="#2a3252"/>
      <rect x="0" y="0" width="360" height="8" rx="4" fill="#f45bd0"/>
      <circle cx="360" cy="4" r="11" fill="#f45bd0" stroke="#12162a" stroke-width="3"/>
      <text x="0" y="36" font-size="14" fill="#8b96bd">明度 Lightness · 0.05–0.97</text>
    </g>
  </g>
</svg>
