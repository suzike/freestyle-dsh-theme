<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="'Segoe UI','PingFang SC',sans-serif">
  <rect width="960" height="480" fill="#12162a"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#f2f4fb">主题设计器 · 独立通道</text>
  <text x="40" y="82" font-size="15" fill="#8b96bd">主色 / 副色 / 面板 三通道独立调节 · 通道锁定 · 配色关系 · 快速变体 · AI 命名 · JSON 导入导出</text>

  <!-- left panel: preview -->
  <g transform="translate(40,110)">
    <rect width="330" height="340" rx="14" fill="#1d2440" stroke="#2a3252"/>
    <text x="20" y="34" font-size="13" fill="#8b96bd" letter-spacing="1">实时预览</text>
    <g transform="translate(20,50)">
      <rect width="290" height="120" rx="10" fill="#0f1d24"/>
      <rect x="0" y="0" width="290" height="26" rx="6" fill="#14262e"/>
      <circle cx="16" cy="13" r="4" fill="#ff6b6b"/>
      <circle cx="30" cy="13" r="4" fill="#ffc95d"/>
      <circle cx="44" cy="13" r="4" fill="#5df08a"/>
      <rect x="10" y="36" width="42" height="74" rx="6" fill="#122a30"/>
      <rect x="62" y="36" width="200" height="14" rx="4" fill="#3ac9c0"/>
      <rect x="62" y="58" width="130" height="8" rx="4" fill="#5c7280"/>
      <rect x="62" y="76" width="72" height="18" rx="9" fill="#3ac9c0"/>
    </g>
    <g transform="translate(20,196)">
      <rect x="0" y="0" width="140" height="40" rx="20" fill="#3ac9c0"/>
      <text x="70" y="26" font-size="14" font-weight="600" fill="#0f1d24" text-anchor="middle">深色</text>
      <rect x="152" y="0" width="140" height="40" rx="20" fill="#1d2440" stroke="#2a3252"/>
      <text x="222" y="26" font-size="14" fill="#8b96bd" text-anchor="middle">浅色</text>
    </g>
  </g>

  <!-- right panel: sliders -->
  <g transform="translate(400,110)">
    <rect width="520" height="340" rx="14" fill="#1d2440" stroke="#2a3252"/>
    <text x="20" y="34" font-size="13" fill="#8b96bd" letter-spacing="1">独立色彩通道</text>
    <g transform="translate(20,52)">
      <rect x="0" y="0" width="70" height="28" rx="14" fill="#3ac9c0"/>
      <text x="35" y="19" font-size="13" font-weight="600" fill="#0f1d24" text-anchor="middle">主色</text>
      <rect x="78" y="0" width="70" height="28" rx="14" fill="#1d2440" stroke="#2a3252"/>
      <text x="113" y="19" font-size="13" fill="#8b96bd" text-anchor="middle">副色</text>
      <rect x="156" y="0" width="70" height="28" rx="14" fill="#1d2440" stroke="#2a3252"/>
      <text x="191" y="19" font-size="13" fill="#8b96bd" text-anchor="middle">面板</text>
    </g>
    <!-- hue swatch grid -->
    <g transform="translate(20,96)">
      <rect x="0" y="0" width="40" height="20" rx="6" fill="#ff5d5d"/>
      <rect x="46" y="0" width="40" height="20" rx="6" fill="#ffc95d"/>
      <rect x="92" y="0" width="40" height="20" rx="6" fill="#9df05d"/>
      <rect x="138" y="0" width="40" height="20" rx="6" fill="#5df0c9"/>
      <rect x="184" y="0" width="40" height="20" rx="6" fill="#5db8ff"/>
      <rect x="230" y="0" width="40" height="20" rx="6" fill="#8d7bff"/>
      <rect x="276" y="0" width="40" height="20" rx="6" fill="#ff7bd0"/>
    </g>
    <!-- sliders -->
    <g transform="translate(20,140)">
      <text x="0" y="0" font-size="12" fill="#8b96bd">色相</text>
      <rect x="60" y="-4" width="400" height="8" rx="4" fill="#2a3252"/>
      <rect x="60" y="-4" width="300" height="8" rx="4" fill="#3ac9c0"/>
      <circle cx="360" cy="0" r="11" fill="#3ac9c0" stroke="#1d2440" stroke-width="3"/>
      <text x="470" y="4" font-size="12" fill="#8b96bd">168°</text>
    </g>
    <g transform="translate(20,200)">
      <text x="0" y="0" font-size="12" fill="#8b96bd">彩度</text>
      <rect x="60" y="-4" width="400" height="8" rx="4" fill="#2a3252"/>
      <rect x="60" y="-4" width="160" height="8" rx="4" fill="#3ac9c0"/>
      <circle cx="220" cy="0" r="11" fill="#3ac9c0" stroke="#1d2440" stroke-width="3"/>
      <text x="470" y="4" font-size="12" fill="#8b96bd">0.160</text>
    </g>
    <g transform="translate(20,260)">
      <text x="0" y="0" font-size="12" fill="#8b96bd">明度</text>
      <rect x="60" y="-4" width="400" height="8" rx="4" fill="#2a3252"/>
      <rect x="60" y="-4" width="340" height="8" rx="4" fill="#3ac9c0"/>
      <circle cx="400" cy="0" r="11" fill="#3ac9c0" stroke="#1d2440" stroke-width="3"/>
      <text x="470" y="4" font-size="12" fill="#8b96bd">0.76</text>
    </g>
    <g transform="translate(20,300)">
      <rect x="0" y="0" width="200" height="28" rx="14" fill="#3ac9c0"/>
      <text x="100" y="19" font-size="13" font-weight="600" fill="#0f1d24" text-anchor="middle">应用主题</text>
      <rect x="210" y="0" width="120" height="28" rx="14" fill="#1d2440" stroke="#2a3252"/>
      <text x="270" y="19" font-size="13" fill="#8b96bd" text-anchor="middle">恢复默认</text>
    </g>
  </g>
</svg>
