# dsh-theme bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field). The node half (exports ".") runs in the host process (AI
# naming route via llm), and the `dsh.client` declaration in package.json
# makes the browser half (exports "./client") load in the web GUI.
- insert:
    - id: theme
      name: '@linxin666/dsh-theme'
